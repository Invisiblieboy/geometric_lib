name: CI
on:
  push:
    branches:
     - main

jobs:
  test_ubu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unittests
        run: python -m unittest -v

  test_win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unittests
        run: python -m unittest -v
